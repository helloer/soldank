name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # the server's WebTransport (rustls with aws-lc): no NASM on Windows runners
  AWS_LC_SYS_PREBUILT_NASM: "1"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install ALSA headers (sound on Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p soldank --all-targets --features dev --locked -- -D warnings

  build:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install ALSA headers (sound on Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  wasm:
    name: Browser build (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p soldank --target wasm32-unknown-unknown --locked -- -D warnings
      - run: web/build.sh --locked

  assets-tests:
    name: Tests with game assets
    runs-on: ubuntu-latest
    env:
      BASE_ASSETS_VERSION: v0.4
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install ALSA headers (sound on Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - name: Cache soldat.smod
        id: smod-cache
        uses: actions/cache@v6
        with:
          path: soldat.smod
          key: soldat-smod-${{ env.BASE_ASSETS_VERSION }}
      - name: Download soldat.smod from opensoldat/base
        if: steps.smod-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$BASE_ASSETS_VERSION" --repo opensoldat/base --pattern soldat.smod
      - run: cargo test --workspace --locked
        env:
          SOLDANK_ASSETS: ${{ github.workspace }}/soldat.smod
          SOLDANK_REQUIRE_ASSETS: "1"
      - name: Performance budget (a tick under 1 ms with 32 players)
        run: |
          cargo bench -p soldank-core --bench tick --locked
          cargo bench -p soldank-server --bench tick --locked
        env:
          SOLDANK_ASSETS: ${{ github.workspace }}/soldat.smod
          SOLDANK_TICK_BUDGET_MS: "1"
