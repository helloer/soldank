name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  build:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  assets-tests:
    name: Tests with game assets
    runs-on: ubuntu-latest
    env:
      BASE_ASSETS_VERSION: v0.4
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache soldat.smod
        id: smod-cache
        uses: actions/cache@v6
        with:
          path: soldat.smod
          key: soldat-smod-${{ env.BASE_ASSETS_VERSION }}
      - name: Download soldat.smod from opensoldat/base
        if: steps.smod-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$BASE_ASSETS_VERSION" --repo opensoldat/base --pattern soldat.smod
      - run: cargo test --workspace --locked
        env:
          SOLDANK_ASSETS: ${{ github.workspace }}/soldat.smod
          SOLDANK_REQUIRE_ASSETS: "1"
