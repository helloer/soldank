name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  # the server's WebTransport (rustls with aws-lc): no NASM on Windows runners
  AWS_LC_SYS_PREBUILT_NASM: "1"
  # OpenSoldat's base game content (CC BY 4.0, see ASSETS.md), shipped next to the programs
  BASE_ASSETS_VERSION: v0.4
  SOLDAT_SMOD_SHA256: 35582954632a0b748f392c123da47fb7cba18e03a45ea0d7640cbf53ce53dd37
  PLAY_REGULAR_TTF_SHA256: a16d8a926b82d5391cb041f928ac8a1597fc713e9bbb65e09f923b4990b58b22

jobs:
  assets:
    name: Game assets
    runs-on: ubuntu-latest
    steps:
      - name: Download from opensoldat/base
        run: |
          base="https://github.com/opensoldat/base/releases/download/$BASE_ASSETS_VERSION"
          curl -fsSL -o soldat.smod "$base/soldat.smod"
          curl -fsSL -o play-regular.ttf "$base/play-regular.ttf"
          echo "$SOLDAT_SMOD_SHA256  soldat.smod" | sha256sum -c
          echo "$PLAY_REGULAR_TTF_SHA256  play-regular.ttf" | sha256sum -c
      - uses: actions/upload-artifact@v7
        with:
          name: assets
          path: |
            soldat.smod
            play-regular.ttf
          if-no-files-found: error

  build:
    name: Build (${{ matrix.target }})
    needs: assets
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install ALSA headers (sound on Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/download-artifact@v8
        with:
          name: assets
          path: assets-download
      - run: cargo build --release --locked --target ${{ matrix.target }} -p soldank -p soldank-server

      - name: Package
        shell: bash
        run: |
          name="soldank-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE ASSETS.md assets-download/soldat.smod assets-download/play-regular.ttf "$name/"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/${{ matrix.target }}/release/soldank.exe" "$name/"
            cp "target/${{ matrix.target }}/release/soldank-server.exe" "$name/"
            7z a "$name.zip" "$name"
          else
            cp "target/${{ matrix.target }}/release/soldank" "$name/"
            cp "target/${{ matrix.target }}/release/soldank-server" "$name/"
            tar czf "$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: soldank-${{ matrix.target }}
          path: soldank-*.*
          if-no-files-found: error

  web:
    name: Build (browser)
    needs: assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32
      - uses: actions/download-artifact@v8
        with:
          name: assets
          path: assets-download
      - run: web/build.sh --locked
      - name: Package
        run: |
          name="soldank-${GITHUB_REF_NAME}-web"
          mkdir "$name"
          # the page and the game; the assets as files, not build.sh's links
          cp target/web/index.html target/web/*.js target/web/soldank.wasm "$name/"
          cp ASSETS.md LICENSE assets-download/soldat.smod assets-download/play-regular.ttf "$name/"
          zip -r "$name.zip" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: soldank-web
          path: soldank-*-web.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [build, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: soldank-*
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
