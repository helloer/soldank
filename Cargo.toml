[workspace]
resolver = "3"
members = ["client", "core", "gfx2d"]
default-members = ["client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["helloer <im.helloer@gmail.com>"]

[workspace.dependencies]
soldank-core = { path = "core" }
gfx2d = { path = "gfx2d" }

anyhow = "1.0"
bitflags = "2.13"
byteorder = "1.5"
clap = { version = "4.6", features = ["derive", "env"] }
glam = "0.33"
image = "0.25"
insta = "1.48"
miniquad = "0.4.11"
rust-ini = "0.21"
slotmap = "1.1"
tempfile = "3.27"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
