[workspace]
resolver = "3"
members = ["client", "core", "gfx2d", "server"]
default-members = ["client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["helloer <im.helloer@gmail.com>"]

[workspace.dependencies]
soldank-core = { path = "core" }
gfx2d = { path = "gfx2d" }

ab_glyph = "0.2.32"
anyhow = "1.0"
bitcode = { version = "0.6", features = ["derive"] }
bitflags = "2.13"
byteorder = "1.5"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive", "env"] }
egui = "0.31"
egui-miniquad = "0.16"
glam = "0.33"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
insta = "1.48"
kira = { version = "0.12.5", default-features = false, features = ["cpal", "wav", "pcm", "adpcm"] }
miniquad = "0.4.11"
# renet2: renet with sockets beside UDP (the browsers' WebTransport)
renet2 = "0.17"
renet2_netcode = { version = "0.17", default-features = false }
rust-ini = "0.21"
slotmap = "1.1"
tempfile = "3.27"
thiserror = "2"
tokio = { version = "1", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
