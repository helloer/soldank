<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Soldank</title>
<style>
  html, body, canvas {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    position: absolute;
    background: #313d4f;
    z-index: 0;
  }
</style>
</head>
<body>
<!-- the right button is the jets: no context menu -->
<canvas id="glcanvas" tabindex="1" oncontextmenu="return false;"></canvas>
<!-- miniquad's loader (its js/gl.js) and the plugins egui-miniquad uses, copied here by
     build.sh, and the game's sound -->
<script src="gl.js"></script>
<script src="sapp_jsutils.js"></script>
<script src="quad-url.js"></script>
<script src="sound.js"></script>
<script>
  document.addEventListener("contextmenu", (event) => event.preventDefault());
  load("soldank.wasm");
</script>
</body>
</html>
