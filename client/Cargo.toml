[package]
name = "soldank"
description = "Open source clone of the Soldat engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[features]
# the debug overlay (F12): cvars, a world inspector, collision and waypoint drawing
dev = []

[dependencies]
soldank-core.workspace = true
gfx2d.workspace = true
ab_glyph.workspace = true
anyhow.workspace = true
clap.workspace = true
rust-ini.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# the front end's menus
egui.workspace = true
egui-miniquad.workspace = true

# not in the browser (wasm32): kira's cpal backend, playing on a server, the local time
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono.workspace = true
kira.workspace = true
renet.workspace = true
renet_netcode.workspace = true

# in the browser: kira with a backend of the game's own, the log in the browser's console
[target.'cfg(target_arch = "wasm32")'.dependencies]
kira = { version = "0.12.5", default-features = false, features = ["wav", "pcm", "adpcm"] }
miniquad = { workspace = true, features = ["log-impl"] }

[dev-dependencies]
slotmap.workspace = true
tempfile.workspace = true
